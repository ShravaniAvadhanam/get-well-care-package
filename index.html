<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffb7d5" />
  <meta name="description" content="A whimsical get well soon care package just for you 💕" />
  <title>Get Well Soon 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&family=Caveat:wght@500;600;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-sparkles" aria-hidden="true"></div>

  <main id="app">
    <!-- Level 0: sealed envelope -->
    <section id="envelope-screen" class="screen active">
      <p class="screen-label">incoming delivery...</p>
      <button id="open-envelope" class="envelope" aria-label="Open envelope">
        <div class="envelope-flap"></div>
        <div class="envelope-body">
          <span class="stamp">💌</span>
          <p>For you</p>
        </div>
        <div class="envelope-letter"></div>
      </button>
      <p class="tap-prompt">tap the envelope to open</p>
    </section>

    <!-- The one greeting card -->
    <section id="card-screen" class="screen" hidden>
      <div class="game-hud">
        <div class="level-badge">care package <span id="step-num">1</span>/<span id="step-total">6</span></div>
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>

      <article id="greeting-card" class="greeting-card">
        <div class="card-inner">
          <div id="card-illustration" class="card-illustration" aria-hidden="true"></div>
          <div id="card-content" class="card-content"></div>
        </div>
      </article>

      <button id="next-btn" class="next-btn">
        <span id="next-label">unwrap next gift →</span>
      </button>
    </section>
  </main>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <script src="script.js"></script>
</body>
</html>
